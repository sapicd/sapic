# sapic v2 Kubernetes 清单（单副本 + 节点本地目录，SQLite）。
#
#   kubectl apply -n sapic -f kube-sapic.yaml
#
# 使用前改三处：镜像 tag、hostPath 路径、env 里的 sapic_secretkey 与
# sapic_external_base_url。只有 Deployment + Service 两个对象：
# 数据直接用节点本地目录，所以只能单副本（Recreate），且多节点集群要给 Pod
# 固定节点（nodeName / nodeAffinity / nodeSelector），否则换节点就是空库。
# 对外的 HTTPS 交给集群外的反代或已有网关，这里只开 NodePort。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sapic
spec:
  replicas: 1
  #: 本地目录不能被两个 Pod 同时挂载。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sapic
  template:
    metadata:
      labels:
        app: sapic
    spec:
      containers:
        - name: sapic
          image: staugur/sapic:latest
          ports:
            - name: http
              containerPort: 80
          env:
            #: 可选：不设就用内置默认密钥；公网多用户建议换成自己的（openssl rand -hex 32）。
            # - name: sapic_secretkey
            #   value: "replace-with-a-random-32-byte-secret"
            #: 图片直链前缀，必须是集群外可达地址。
            - name: sapic_external_base_url
              value: "https://sapic.example.com"
            #: 前面有反代/网关时信任 X-Forwarded-*，否则日志与限流拿到内网 IP。
            - name: sapic_proxyfix
              value: "true"
            #: SQLite 是库级写锁，多进程会互相抢锁；换 PostgreSQL 时改成多 worker。
            - name: WEB_CONCURRENCY
              value: "1"
            #: 要外部 PostgreSQL 就打开这项（DSN 里含密码，注意别提交到仓库）。
            # - name: sapic_db_url
            #   value: "postgresql://user:pass@db-host:5432/sapic"
          volumeMounts:
            #: 库文件、上传文件、第三方钩子包都在这里。
            - name: data
              mountPath: /app/server/data
          #: 就绪看库（库不通别收流量）；存活只看进程，库抖动不该重启 Pod。
          readinessProbe:
            httpGet:
              path: /api/v2/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: "2", memory: 1Gi }
      volumes:
        - name: data
          #: 节点本地目录：数据留在当前节点上，确保 Pod 固定在同一节点。
          hostPath:
            path: /data/sapic
            type: DirectoryOrCreate

---
apiVersion: v1
kind: Service
metadata:
  name: sapic
spec:
  #: 没有 Ingress，直接给节点端口；外层 HTTPS 反代指向 <节点IP>:<nodePort>。
  type: NodePort
  selector:
    app: sapic
  ports:
    - name: http
      port: 80
      targetPort: http
