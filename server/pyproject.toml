[project]
name = "sapic-server"
version = "2.0.0.dev0"
description = "Sapic v2 backend: API-only image hosting service"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0",
    "peewee>=3.17",
    "redis>=5.0",
    "psycopg[binary]>=3.1",
    "PyMySQL>=1.1",
    "PyJWT>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
server = [
    "gunicorn>=21.2",
    "gevent>=23.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sapic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
