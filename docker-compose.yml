# sapic v2 单机编排：单个容器 + SQLite（库文件在数据卷里），配置全部走环境变量。
#
#   SAPIC_SECRET_KEY=$(openssl rand -hex 32) docker compose up -d
#
# SQLite 只适合单实例；要多进程/多副本请换 PostgreSQL（见 DEPLOY.md 第 3.7 节）。
# 这里只列必需项，其余走镜像/代码默认值，需要时用同名环境变量覆盖。
services:
  sapic:
    image: staugur/sapic:latest
    build: .
    restart: unless-stopped
    ports:
      - "${SAPIC_PORT:-80}:80"
    environment:
      #: 可选：不设就用内置默认密钥（够长，单机自用足够）；公网多用户建议换成自己的。
      sapic_secretkey: "${SAPIC_SECRET_KEY:-}"
      #: 不设 sapic_db_url：默认就是数据卷里的 SQLite（/app/server/data/sapic.db）。
      #: 要换 PostgreSQL 加一行 sapic_db_url: "postgresql://user:pass@host:5432/sapic"。
      #: 图片直链前缀，建议设成对外地址。
      sapic_external_base_url: "${SAPIC_BASE_URL:-http://localhost}"
      #: 容器内 nginx 在前面，不信任 X-Forwarded-* 会拿到 127.0.0.1。
      sapic_proxyfix: "true"
      #: SQLite 是库级写锁，多进程会互相抢锁；要并发就换 PostgreSQL。
      WEB_CONCURRENCY: "1"
    volumes:
      #: 库文件、上传文件、第三方钩子包都在这里，不挂卷等于重建即丢数据。
      - sapic-data:/app/server/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/api/v2/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  sapic-data:
