# sapic v2 单机编排：应用 + PostgreSQL。
#
#   SAPIC_SECRET_KEY=$(openssl rand -hex 32) docker compose up -d
#
# 生产务必：改掉默认数据库密码、设置 sapic_external_base_url 为对外地址、
# 在前面再挂一层 HTTPS（本编排只暴露 80）。
services:
  sapic:
    image: staugur/sapic:latest
    build:
      context: .
    restart: unless-stopped
    ports:
      #: 左边是宿主端口，右边是容器内 nginx 端口（由 SAPIC_HTTP_PORT 决定，默认 80）。
      - "${SAPIC_PORT:-80}:${SAPIC_HTTP_PORT:-80}"
    environment:
      #: 容器内 nginx 监听端口；默认 80，与宿主的 SAPIC_PORT 解耦。
      SAPIC_HTTP_PORT: "${SAPIC_HTTP_PORT:-80}"
      #: 会话签名密钥，生产强制要求；不给值容器会直接退出。
      sapic_secretkey: "${SAPIC_SECRET_KEY:?请先设置 SAPIC_SECRET_KEY}"
      sapic_env: prod
      sapic_db_url: "postgresql://sapic:${POSTGRES_PASSWORD:-sapic}@db:5432/sapic"
      #: 生成的图片直链前缀；留空则用相对地址。
      sapic_external_base_url: "${SAPIC_BASE_URL:-http://localhost}"
      #: 整请求上限，需大于后台最大的单文件上限（默认图片 10M / 视频 20M）。
      sapic_maxupload: "25"
      #: 容器在 nginx 后面，信任 X-Forwarded-*，否则日志与限流拿到的是内网 IP。
      sapic_proxyfix: "true"
      sapic_loglevel: "INFO"
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-4}"
    volumes:
      #: SQLite（未使用）、上传文件、第三方钩子包都在这里。
      - sapic-data:/app/server/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/api/v2/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sapic
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-sapic}"
      POSTGRES_DB: sapic
      #: 中文用户名/相册名不乱码，容器 locale 需要 UTF-8。
      LANG: C.UTF-8
    volumes:
      - sapic-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sapic -d sapic"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  sapic-data:
  sapic-db:
