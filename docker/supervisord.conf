; sapic 容器内的进程管理：gunicorn（web）、独立调度进程与 nginx。
;
; 为什么不再让 web worker 内跑 APScheduler：worker 会被滚动更新、超时或 OOM
; 杀掉，调度器随之重启；而「哪个 worker 抢到锁」是随机的，后台页面多半显示
; standby，看起来像没启动。独立进程由 supervisor 拉起，生命周期与 web 解耦，
; 重启也只影响调度本身（任务都幂等）。
;
; supervisor 不展开 $VAR，所以 web / scheduler 各有一层 wrapper 脚本。
;
; 这份配置装到 /etc/supervisord.conf（supervisorctl 的默认搜索路径之一），
; 容器里直接 `supervisorctl status` / `supervisorctl restart scheduler` 即可；
; entrypoint 用 `supervisord -c /etc/supervisord.conf` 启动。

[unix_http_server]
file=/run/supervisord.sock

[supervisorctl]
serverurl=unix:///run/supervisord.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
childlogdir=/tmp

[program:web]
command=/usr/local/bin/sapic-web
priority=10
autostart=true
autorestart=true
startsecs=3
;: gunicorn 优雅退出默认等 30s，这里留够，避免升级时被强杀。
stopwaitsecs=40
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=/usr/local/bin/sapic-scheduler
priority=20
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=20
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=30
autostart=true
autorestart=true
startsecs=2
stopwaitsecs=10
stopsignal=QUIT
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
