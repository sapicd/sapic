# sapic 容器内的 nginx：托管 web/dist，把 /api（含 /api/v2/userscript.user.js）与 /raw
# 反代给 gunicorn。
#
# 本文件是**模板**：entrypoint 启动时把 __LISTEN_PORT__ 换成 $SAPIC_HTTP_PORT
# （默认 80）后写入 /etc/nginx/conf.d/default.conf，所以这里不要直接写死端口。
# 与 DEPLOY.md 的 nginx 示例保持等价，改这里时同步文档。

upstream sapic_backend {
    server 127.0.0.1:9514;
    keepalive 16;
}

#: 外层（Traefik / WAF / 负载均衡）终止 TLS 时，容器内监听的是 80，$scheme 恒为 http。
#: 直接写 $scheme 会把上游传来的 https 覆盖成 http，后果是 request.is_secure 为假、
#: 会话 Cookie 丢 Secure 标志、OIDC 回调拼成 http 地址。这里优先透传上游值，
#: 只有上游没给（裸容器直连）才回落到 $scheme。
map $http_x_forwarded_proto $sapic_fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen __LISTEN_PORT__ default_server;
    server_name _;

    root /app/web/dist;
    index index.html;

    #: 与 sapic_maxupload（默认 25M）对齐，留出 multipart 开销。
    client_max_body_size 32m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/wasm image/svg+xml;

    #: 入口页面不缓存，前端发版后立即生效。
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    #: ^~ 是关键：下面的静态资源正则（~* \.(js|css|…)）优先级高于普通前缀匹配，
    #: 不加就会把 /api/v2/userscript.user.js 当成静态文件而 404。
    location ^~ /api/ {
        proxy_pass http://sapic_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $sapic_fwd_proto;
        proxy_read_timeout 120s;
        #: pip 安装第三方钩子可能跑几十秒，留给后台页面。
        proxy_send_timeout 180s;
    }

    #: 同样用 ^~ 挡住静态资源正则（图片名可能带 .png/.js 之类后缀）。
    location ^~ /raw/ {
        proxy_pass http://sapic_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $sapic_fwd_proto;
        proxy_read_timeout 300s;
        #: 大图/视频边读边发，不在 nginx 里攒满再吐。
        proxy_buffering off;
    }

    #: 带指纹的构建产物可以长期缓存。
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    #: SPA 回退：/plaza、/admin/* 这类前端路由刷新不能 404。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
